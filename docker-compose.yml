# Environnement de dev Flutter conteneurisé pour mscore.
# Rien n'est installé sur la machine hôte : tout passe par ce conteneur.
#
# Usage courant via le Makefile : make build / make get / make analyze / make web
services:
  flutter:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: "1001"
        GID: "1001"
    image: mscore-flutter:local
    working_dir: /app
    volumes:
      - ./:/app
      # Caches persistants (accélère pub get / builds gradle entre les runs)
      - pub-cache:/home/dev/.pub-cache
      - gradle-cache:/home/dev/.gradle
    ports:
      - "8090:8080" # serveur web Flutter (make web)
    stdin_open: true
    tty: true

  # Proxy d'agrégation (recherche de morceaux en ligne : LRCLIB, The Session…).
  # L'app Flutter (web + APK) tape ce seul endpoint pour contourner le CORS.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: rubato-proxy:local
    ports:
      - "8091:8091" # http://localhost:8091
    restart: unless-stopped

volumes:
  pub-cache:
  gradle-cache:
