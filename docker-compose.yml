# Environnement de dev Flutter conteneurisé pour mscore.
# Rien n'est installé sur la machine hôte : tout passe par ce conteneur.
#
# Usage courant via le Makefile : make build / make get / make analyze / make web
services:
  flutter:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: "1001"
        GID: "1001"
    image: mscore-flutter:local
    working_dir: /app
    volumes:
      - ./:/app
      # Caches persistants (accélère pub get / builds gradle entre les runs)
      - pub-cache:/home/dev/.pub-cache
      - gradle-cache:/home/dev/.gradle
    ports:
      - "8090:8080" # serveur web Flutter (make web)
    stdin_open: true
    tty: true

  # Backend Go (dossier backend/). Image officielle Go, source montée, `go run` :
  # rien à builder pour le dev. `backend/Dockerfile` existe mais ne sert qu'au
  # déploiement (Fly.io, cf. backend/README.md) — ne pas l'utiliser ici, il
  # compile un binaire figé.
  # Variante Debian (et non -alpine) car elle embarque `curl` : le searcher
  # e-chords passe par curl pour contourner le challenge Cloudflare (le
  # fingerprint TLS de la stdlib Go est bloqué, celui de curl passe).
  backend:
    image: golang:1.24
    working_dir: /app
    volumes:
      - ./backend:/app
      # Caches persistants (modules + build) entre les runs.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8091:8080" # 8080 pris, 8090 = web Flutter → 8091
    command: go run .

volumes:
  pub-cache:
  gradle-cache:
  go-mod-cache:
  go-build-cache:
