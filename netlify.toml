# Déploiement du backend Rubato (recherche de morceaux en ligne) sur Netlify.
#
# Le backend est une **Netlify Function** (Node) qui expose les routes
# /health, /search, /representation (agrégation LRCLIB + The Session).
#
# Pas de build applicatif ici (le web Flutter n'est PAS déployé par ce fichier) :
# on publie une page statique minimale + la function.

[build]
  publish = "netlify/public"
  # Pas de commande de build : uniquement des assets statiques + une function.
  command = ""

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
